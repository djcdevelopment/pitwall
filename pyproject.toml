[project]
name = "pitwall"
version = "0.1.0"
description = "Pitwall: local AI workshop instrument cluster (read-only collector API)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]
include = ["pitwall*"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server"]
